<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Noordpijl voor de kaartpagina's. Bewust zwart-wit en zonder tekstelement: een <text> hangt af
     van een lettertype dat op de exportmachine kan ontbreken, dus de N staat als pad. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="#000000" stroke="none">
    <!-- pijl: dichte oostelijke helft, open westelijke helft -->
    <path d="M 50 30 L 74 92 L 50 78 Z"/>
    <path d="M 50 30 L 26 92 L 50 78 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <!-- de letter N als pad, 20 hoog boven de pijl -->
    <path d="M 38 24 L 38 4 L 44 4 L 56 17 L 56 4 L 62 4 L 62 24 L 56 24 L 44 11 L 44 24 Z"/>
  </g>
</svg>
