name: ci-qgis
# Two container images of several gigabytes each, so this is the expensive half and the triggers
# matter. Same rule as ci.yml: `push` only on the branches that carry no pull request of their
# own, `pull_request` for everything else, and one run instead of two for a commit that has both.
# See the comments there for why `paths-ignore` is on push only and why `README.md` is not in it.
#
# The schedule exists for `headless-live` and for nothing else. A whole study against the live DOV
# services on every commit is container time for a job that is already `continue-on-error` and
# whose failures are usually DOV being down; once a week says the same thing, and
# `workflow_dispatch` says it on demand. It is not a required check and must not become one.
# `shell` is what protects the plugin - it caught the 3.34 segfault, the Qt6 labelling difference
# and the info-box slack that Windows hid - so it keeps running on every commit, both images, the
# whole matrix. It skips the weekly run: the live study drives the same newest image through a
# real pipeline, so a broken image shows up there too.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
  pull_request:
  schedule:
    - cron: '23 5 * * 1'  # Monday, off the hour: the top of the hour is queued the world over
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # The shell tests need a Python that has qgis, so they run inside the QGIS images: the oldest
    # version the plugin claims (3.34) and the newest, which is where a 4.x API break shows up
    # first. In the plain venv tests/qgis skips itself.
    strategy:
      fail-fast: false
      matrix:
        image: [qgis/qgis:release-3_34, qgis/qgis:latest]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      # The images ship a system Python that pip refuses to write into without the flag (PEP 668);
      # the older image predates that refusal and does not know the flag.
      - name: Install pytest
        run: python3 -m pip install --break-system-packages pytest || python3 -m pip install pytest
      # QT_QPA_FONTDIR: offscreen uses Qt's own font database, and without a directory every letter
      # renders as a black box while the tests stay green. The live pipeline test is deselected by
      # name as well as by marker: it takes a quarter of an hour against the real DOV services.
      - name: Run the shell tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: /usr/share/fonts
        run: >
          python3 -m pytest tests/qgis -q -m "not live"
          --deselect tests/qgis/test_pipeline.py::test_live_pipeline_for_gent

  headless-live:
    runs-on: ubuntu-latest
    container: qgis/qgis:latest
    # A smoke test against the live services on the newest image only: it says whether a real study
    # still comes out whole, and its sheets can be looked at in the artefact. Allowed to fail -
    # DOV being down is not this repository being broken. And exactly because it is allowed to
    # fail, it does not belong on every commit: weekly, or by hand before a release or after a
    # change to a service URL, a parser or the catalogue.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Run one study for Gent
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: /usr/share/fonts
        run: >
          python3 scripts/run_headless.py --x 104326 --y 192506 --buffer 50
          --out uitvoer/ci --paginas
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktopstudie-gent
          path: |
            uitvoer/ci/paginas
            uitvoer/ci/rapport.pdf
